<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">南禺山 · 季节水穴</title><desc id="desc">季节读法依据识典古籍 S1；维基文库对应处有异文，秋季未记。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#497e8a"/></marker></defs>
<rect width="1120" height="620" fill="#f4f0e5"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="44" y="52" font-size="30" fill="#253e3a" font-weight="700" text-anchor="start">南禺山 · 季节水穴</text>
<text x="44" y="85" font-size="17" fill="#626e63" font-weight="400" text-anchor="start">季节读法依据识典古籍 S1；维基文库对应处有异文，秋季未记。</text>
<text x="52" y="140" font-size="22" fill="#253e3a" font-weight="400" text-anchor="start">山上多金玉 / 山下多水</text><text x="600" y="140" font-size="20" fill="#253e3a" font-weight="400" text-anchor="start">佐水 → 东南入海；另有凤皇、鵷鶵</text><rect x="44" y="174" width="320" height="330" rx="14" fill="#fffdf7" stroke="#c7d1c4" stroke-width="2"/><rect x="400" y="174" width="320" height="330" rx="14" fill="#fffdf7" stroke="#c7d1c4" stroke-width="2"/><rect x="756" y="174" width="320" height="330" rx="14" fill="#fffdf7" stroke="#c7d1c4" stroke-width="2"/><text x="204" y="221" font-size="27" fill="#253e3a" font-weight="700" text-anchor="middle">春 · 水入</text><text x="560" y="221" font-size="27" fill="#253e3a" font-weight="700" text-anchor="middle">夏 · 水出</text><text x="916" y="221" font-size="27" fill="#253e3a" font-weight="700" text-anchor="middle">冬 · 闭</text><path d="M82,418 L112,319 Q204,227 298,319 L327,418Z" fill="#bfbdad"/><path d="M153,417 V350 Q204,276 255,350 V417Z" fill="#555f58"/><path d="M438,418 L468,319 Q560,227 654,319 L683,418Z" fill="#bfbdad"/><path d="M509,417 V350 Q560,276 611,350 V417Z" fill="#555f58"/><path d="M794,418 L824,319 Q916,227 1010,319 L1039,418Z" fill="#bfbdad"/><path d="M865,417 V350 Q916,276 967,350 V417Z" fill="#555f58"/><path d="M71,380 L197,380" stroke="#497e8a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M566,380 L699,380" stroke="#497e8a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M872,322 L961,412 M961,322 L872,412" stroke="#a76345" stroke-width="5" stroke-dasharray="9 6"/><text x="204" y="472" font-size="21" fill="#253e3a" font-weight="400" text-anchor="middle">水在春季进入</text><text x="560" y="472" font-size="21" fill="#253e3a" font-weight="400" text-anchor="middle">夏季才出来</text><text x="916" y="472" font-size="21" fill="#253e3a" font-weight="400" text-anchor="middle">封闭原因未说明</text><text x="46" y="538" font-size="21" fill="#253e3a" font-weight="400" text-anchor="start">水穴与佐水未明确连通；不据季节描述推定机关、冰冻或凤鸟穴居。</text>
<path d="M44,557 H1076" stroke="#d1cfbd"/>
<text x="44" y="590" font-size="18" fill="#626e63" font-weight="400" text-anchor="start">原文要素示意 · 本次绘制 · 无比例尺 · 图形、摆位与尺寸不构成原著记载</text>
</g></svg>