<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">青丘山 · 坡向与水陆要素</title><desc id="desc">北侧为阴、南侧为阳采用传统释义；箭头仅标水流，不标捕食关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#497e8a"/></marker></defs>
<rect width="1120" height="620" fill="#f4f0e5"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="44" y="52" font-size="30" fill="#253e3a" font-weight="700" text-anchor="start">青丘山 · 坡向与水陆要素</text>
<text x="44" y="85" font-size="17" fill="#626e63" font-weight="400" text-anchor="start">北侧为阴、南侧为阳采用传统释义；箭头仅标水流，不标捕食关系。</text>
<rect x="44" y="117" width="430" height="421" rx="14" fill="#fffdf7" stroke="#c7d1c4" stroke-width="2"/><text x="71" y="157" font-size="23" fill="#253e3a" font-weight="700" text-anchor="start">资源剖面示意</text><path d="M78,385 L255,207 L443,385Z" fill="#bbc9b9" stroke="#78917c" stroke-width="3"/><text x="80" y="218" font-size="22" fill="#253e3a" font-weight="400" text-anchor="start">北 / 阴</text><text x="350" y="218" font-size="22" fill="#253e3a" font-weight="400" text-anchor="start">南 / 阳</text><text x="78" y="412" font-size="20" fill="#253e3a" font-weight="400" text-anchor="start">多青䨼（青雘）</text><text x="340" y="412" font-size="22" fill="#253e3a" font-weight="400" text-anchor="start">多玉</text><text x="73" y="458" font-size="23" fill="#253e3a" font-weight="400" text-anchor="start">陆兽：九尾狐</text><text x="73" y="497" font-size="23" fill="#253e3a" font-weight="400" text-anchor="start">鸟类：灌灌</text><rect x="517" y="117" width="559" height="421" rx="14" fill="#fffdf7" stroke="#c7d1c4" stroke-width="2"/><text x="545" y="157" font-size="23" fill="#253e3a" font-weight="700" text-anchor="start">水系关系示意</text><rect x="547" y="188" width="220" height="64" rx="14" fill="#e7eddf" stroke="#c7d1c4" stroke-width="2"/><text x="657" y="229" font-size="24" fill="#253e3a" font-weight="400" text-anchor="middle">青丘之山</text><path d="M657,255 L657,312" stroke="#497e8a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="690" y="295" font-size="20" fill="#253e3a" font-weight="400" text-anchor="start">发源</text><rect x="547" y="322" width="220" height="64" rx="14" fill="#dbeaed" stroke="#c7d1c4" stroke-width="2"/><text x="657" y="363" font-size="24" fill="#253e3a" font-weight="400" text-anchor="middle">英水</text><path d="M657,389 L657,443" stroke="#497e8a" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="690" y="428" font-size="20" fill="#253e3a" font-weight="400" text-anchor="start">南流</text><rect x="547" y="454" width="220" height="64" rx="14" fill="#b6d1d2" stroke="#c7d1c4" stroke-width="2"/><text x="657" y="496" font-size="24" fill="#253e3a" font-weight="400" text-anchor="middle">即翼之泽</text><rect x="804" y="294" width="241" height="104" rx="14" fill="#fffdf7" stroke="#c7d1c4" stroke-width="2"/><text x="824" y="332" font-size="23" fill="#253e3a" font-weight="400" text-anchor="start">水中多赤鱬</text><text x="824" y="370" font-size="21" fill="#253e3a" font-weight="400" text-anchor="start">鱼形 · 人面</text><path d="M804,346 L769,346" stroke="#497e8a" stroke-width="4" fill="none" stroke-dasharray="9 7"/><text x="801" y="466" font-size="20" fill="#253e3a" font-weight="400" text-anchor="start">不与柜山同名</text><text x="801" y="498" font-size="20" fill="#253e3a" font-weight="400" text-anchor="start">英水自动合并</text>
